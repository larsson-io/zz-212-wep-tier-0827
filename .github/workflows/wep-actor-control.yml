name: WEP actor control
run-name: WEP-ACTOR-CONTROL-${{ github.sha }}
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - name: Prove protected secret reaches execution
        env:
          PROBE_SECRET: ${{ secrets.WEP_ORG_TIER_SECRET }}
        run: python3 -c 'import hashlib,os; print("WEP_SECRET_SHA256=" + hashlib.sha256(os.environ["PROBE_SECRET"].encode()).hexdigest())'
